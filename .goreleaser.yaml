version: 2

# POSTHOG_CLI_KEY is the PostHog project key for CLI usage events (SEL-4304).
# It is a repository secret supplied by the release workflow, and it is
# deliberately absent from the source tree. When it is unset — local builds,
# forks, `goreleaser build --snapshot` — the key stays empty and the CLI sends
# no telemetry at all.
env:
  - POSTHOG_CLI_KEY={{ if index .Env "POSTHOG_CLI_KEY" }}{{ .Env.POSTHOG_CLI_KEY }}{{ end }}

before:
  hooks:
    - go mod tidy

builds:
  - id: saber
    main: ./cmd/saber
    binary: saber
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/saberapp/cli/internal/telemetry.posthogKey={{ .Env.POSTHOG_CLI_KEY }}

archives:
  - id: default
    name_template: "saber_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

brews:
  - name: saber
    repository:
      owner: saberapp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://saber.app"
    description: "Run Saber signal research from your terminal"
    install: |
      bin.install "saber"
    test: |
      system "#{bin}/saber", "version"

checksum:
  name_template: "saber_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: saberapp
    name: cli
  name_template: "CLI v{{.Version}}"
  draft: false
  prerelease: auto

snapshot:
  name_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore[^(]"
      - Merge pull request
      - Merge branch
